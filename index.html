<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2125">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Correia Obras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<div id="carregando" class="carregando"><div class="spinner"></div><span>Carregando dados…</span></div>

<div id="entrada" class="entrada" hidden>
  <form class="entrada-caixa" id="formEntrada" autocomplete="off">
    <svg viewBox="0 0 100 100" class="entrada-logo" aria-hidden="true">
      <path d="M60 20 A28 28 0 1 0 60 80" fill="none" stroke="#c7c4bb" stroke-width="9" stroke-linecap="round"/>
      <polygon points="46,58 68,40 90,58 90,62 46,62" fill="#b8862b"/>
      <rect x="50" y="56" width="10" height="26" fill="#1d2125"/>
      <rect x="64" y="56" width="18" height="26" fill="#b8862b"/>
    </svg>
    <h1>Correia Obras</h1>
    <p class="mut" id="entradaTexto">Digite seu PIN para entrar.</p>
    <div class="campo" id="campoNome" hidden><label>Seu nome</label><input id="entNome" maxlength="40"></div>
    <div class="campo"><label>PIN</label><input id="entPin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="6" maxlength="12" required></div>
    <div class="campo" id="campoPin2" hidden><label>Repita o PIN</label><input id="entPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12"></div>
    <button class="btn btn-primario btn-bloco" id="entBotao">Entrar</button>
    <p class="erro" id="entErro"></p>
  </form>
</div>

<aside class="lateral">
  <div class="marca">
    <svg viewBox="0 0 100 100" class="marca-logo" aria-hidden="true">
      <path d="M60 20 A28 28 0 1 0 60 80" fill="none" stroke="#c7c4bb" stroke-width="9" stroke-linecap="round"/>
      <polygon points="46,58 68,40 90,58 90,62 46,62" fill="#b8862b"/>
      <rect x="50" y="56" width="10" height="26" fill="#fff"/>
      <rect x="64" y="56" width="18" height="26" fill="#b8862b"/>
    </svg>
    <div><strong>CORREIA</strong><span>Obras e Projetos</span></div>
  </div>
  <nav class="nav" id="navLateral"></nav>
  <div class="lateral-rodape" id="usuarioLateral"></div>
</aside>

<header class="topo">
  <button class="topo-voltar" id="btnVoltar" aria-label="Voltar" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="titulo">Início</h1>
  <button class="btn btn-primario topo-lancar" onclick="Form.lancamento()">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Lançar</span>
  </button>
</header>

<main id="conteudo" class="conteudo"></main>

<nav class="barra-inferior" id="navInferior"></nav>

<div id="folha" class="folha-fundo" onclick="if(event.target===this)Folha.fechar()">
  <div class="folha" role="dialog" aria-modal="true">
    <div class="folha-cab">
      <h2 id="folhaTitulo"></h2>
      <button class="icone" onclick="Folha.fechar()" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="folhaCorpo" class="folha-corpo"></div>
  </div>
</div>

<div id="aviso" class="aviso"></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
